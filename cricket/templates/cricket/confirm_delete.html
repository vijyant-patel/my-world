{% extends 'cricket/cricket_base.html' %}

{% block title %}Confirm Delete - Cricket Module{% endblock %}

{% block cricket_content %}
<div class="card shadow-sm border-0" style="max-width: 500px; margin: 0 auto; margin-top: 50px;">
    <div class="card-body text-center p-5">
        <h3 class="text-danger mb-4">Confirm Deletion</h3>
        <p class="mb-4">Are you sure you want to delete this record?</p>
        <p class="fw-bold fs-5 text-muted mb-4">{{ object }}</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
